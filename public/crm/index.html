    const lines = ['Parameters:TimeZone=America/Sao_Paulo', 'Phone Number,Conversion Name,Conversion Time,Conversion Value,Conversion Currency'];
    for (const { l, t } of rows) {
      const d = new Date(t);
      const ts = `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const value = val === 'fee' ? (num(l.fee) || fix || 0) : fix;
      lines.push([await sha256hex(l.e164), '"' + name.replace(/"/g, '""') + '"', ts, value.toFixed(2), 'BRL'].join(','));
    }
    closeModal(true);
    await offerFile(`Upload Ads ${today()}.csv`, lines.join('\r\n'), 'text/csv');
  });
}

/* ================= events ================= */
function bindStatic() {
  $$('.nav-btn').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  let qT = 0;
  $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { UI.q = e.target.value; scheduleRender(); }, 120); });
  $('#btnNew').addEventListener('click', () => openNewModal());
  $('#btnQuote').addEventListener('click', () => openQuote(UI.drawerId));
  $('#filters').addEventListener('change', e => {
    const id = e.target.id; const v = e.target.value;
    if (id === 'fPeriod') UI.period = v; else if (id in { fResp: 1, fServ: 1, fCanal: 1 }) UI[id] = v;
    persistUI(); scheduleRender();
  });
  $('#filters').addEventListener('click', e => { if (e.target.id === 'fClear') { UI.fResp = UI.fServ = UI.fCanal = ''; persistUI(); scheduleRender(); } });
  $('#banner').addEventListener('click', e => { if (e.target.closest('[data-clear-examples]')) clearExamples(e.target.closest('[data-clear-examples]')); });

  const view = $('#view');
  view.addEventListener('click', e => {
    const t = e.target;
    let el;
    if ((el = t.closest('[data-quick]'))) { UI.quick = el.dataset.quick; UI.quickFocus = true; scheduleRender(); return; }
    if (t.closest('[data-quick-cancel]')) { UI.quick = null; scheduleRender(); return; }
    if ((el = t.closest('[data-add]'))) { openNewModal({ stage: el.dataset.add }); return; }
    if (t.closest('[data-empty-new]')) { openNewModal(); return; }
    if (t.closest('[data-empty-import]') || t.closest('[data-import]')) { $('#fileIn').value = ''; $('#fileIn').click(); return; }
    if ((el = t.closest('.card'))) { if (!UI.justDragged) openDrawer(el.dataset.id); return; }
    if ((el = t.closest('[data-tab]'))) { UI.listTab = el.dataset.tab; persistUI(); scheduleRender(); return; }
    if ((el = t.closest('[data-sort]'))) { const k = el.dataset.sort; UI.sort = { k, dir: UI.sort.k === k ? -UI.sort.dir : (['fee', 'num', 'criado'].includes(k) ? -1 : 1) }; persistUI(); scheduleRender(); return; }
    if ((el = t.closest('[data-followup]'))) { openFollowup(el.dataset.followup); return; }
    if ((el = t.closest('[data-done]'))) { retornoFeito(el.dataset.done, +el.dataset.n, el.dataset.kind); return; }
    if ((el = t.closest('[data-open]'))) { openDrawer(el.dataset.open); return; }
    if ((el = t.closest('[data-quality]'))) { UI.listTab = 'pend'; persistUI(); setView('lista'); return; }
    if ((el = t.closest('[data-rm]'))) { const k = el.dataset.rm; const arr = S.cfg[k].slice(); arr.splice(+el.dataset.i, 1); if (!arr.length) { toast('A lista precisa de pelo menos uma opção.'); return; } saveCfg({ ...S.cfg, [k]: arr }); return; }
    if ((el = t.closest('[data-export]'))) { const k = el.dataset.export; if (k === 'xlsx') exportXlsx(); else if (k === 'csv') exportCsv(); else if (k === 'json') exportJson(); else openAdsModal(); return; }
    if ((el = t.closest('[data-clear-examples]'))) { clearExamples(el); return; }
    if (t.closest('[data-logout]')) { logout(); return; }
    if (t.closest('a, select, button, input')) return;
    if ((el = t.closest('tr[data-id]'))) { openDrawer(el.dataset.id); }
  });
  view.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const el = e.target.closest('.card, tr[data-id]');
    if (el && e.target === el) { e.preventDefault(); openDrawer(el.dataset.id); }
    if (e.target.id === 'quickIn') return;
  });
  view.addEventListener('keyup', e => { if (e.key === 'Escape' && e.target.id === 'quickIn') { UI.quick = null; scheduleRender(); } });
  view.addEventListener('change', e => {
    if (e.target.matches('[data-price], [data-niche]')) { savePrice(e.target); return; }
    const s = e.target.closest('[data-row-stage]');
    if (s) { const id = s.dataset.rowStage; const to = s.value; if (to === 'perdido') askLoss(id); else moveStage(id, to); }
  });
  view.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.quickForm) {
      const inp = $('#quickIn'); const v = inp.value.trim(); if (!v) { inp.focus(); return; }
      const k = f.dataset.quickForm;
      createLead(blankLead({ empresa: v, stage: k, order: bottomOrder(k), wonAt: k === 'fechado' ? Date.now() : 0 }));
      inp.value = ''; UI.quickFocus = true;
      const list = $(`.col-list[data-stage="${k}"]`); if (list) setTimeout(() => { const l2 = $(`.col-list[data-stage="${k}"]`); if (l2) l2.scrollTop = l2.scrollHeight; }, 60);
      return;
    }
    if (f.dataset.addOpt) {
      const k = f.dataset.addOpt; const inp = f.querySelector('input'); const v = inp.value.trim();
      if (!v) return;
      if (S.cfg[k].some(o => norm(o) === norm(v))) { toast('Essa opção já existe.'); return; }
      saveCfg({ ...S.cfg, [k]: [...S.cfg[k], v] });
      setTimeout(() => { const i2 = $(`[data-add-opt="${k}"] input`); if (i2) i2.focus(); }, 60);
    }
  });

  // drawer
  const dw = $('#drawerWrap'), dr = $('#drawer');
  dw.addEventListener('click', e => { if (e.target.closest('[data-close-drawer]')) closeDrawer(); });
  dr.addEventListener('input', e => {
    const el = e.target; const f = el.dataset.f; const id = UI.drawerId;
    if (!f || !id || el.type === 'date' || el.tagName === 'SELECT' || el.hasAttribute('data-money')) return;
    if (f === 'whats') {
      const ph = phoneInfo(el.value);
      const enough = el.value.replace(/\D/g, '').length >= 10 || !el.value.trim();
      patchLead(id, { whats: el.value, e164: ph.e164, foneAviso: enough ? ph.warn : '' }, 700);
      $('#d-phonewarn').textContent = enough ? ph.warn : '';
      return;
    }
    patchLead(id, { [f]: el.value }, 700);
  });
  dr.addEventListener('change', e => {
    const el = e.target; const f = el.dataset.f; const id = UI.drawerId;
    if (!f || !id) return;
    if (el.hasAttribute('data-money')) { const v = parseMoney(el.value); el.value = v ? NUMF.format(v) : ''; patchLead(id, { [f]: v }); return; }
    if (el.type === 'date' || el.tagName === 'SELECT') { patchLead(id, { [f]: el.value }); return; }
    flushLead(id);
  });
  dr.addEventListener('click', e => {
    const t = e.target; const id = UI.drawerId; if (!id) return;
    const l = S.leads.get(id); if (!l) return;
    let el;
    if ((el = t.closest('[data-stage]'))) { const to = el.dataset.stage; if (to !== l.stage) { if (to === 'perdido') askLoss(id); else moveStage(id, to); } return; }
    if ((el = t.closest('[data-temp]'))) { patchLead(id, { temp: el.dataset.temp }); return; }
    if ((el = t.closest('[data-serv]'))) { const s = el.dataset.serv; const cur = l.servicos || []; patchLead(id, { servicos: cur.includes(s) ? cur.filter(x => x !== s) : [...cur, s] }); return; }
    if ((el = t.closest('[data-prox]'))) { const v = el.dataset.prox; patchLead(id, { prox: v === 'clear' ? '' : addDays(today(), +v) }); return; }
    if ((el = t.closest('[data-copy]'))) { copyText(el.dataset.copy); return; }
    if (t.closest('[data-quote]')) { flushLead(id); openQuote(id); return; }
    if (t.closest('[data-followup]')) { flushLead(id); openFollowup(id); return; }
    if ((el = t.closest('[data-del]'))) {
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmar exclusão'; setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = 'Excluir lead'; } }, 4000); return; }
      deleteLead(id); return;
    }
  });
  dr.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id !== 'noteForm') return;
    const inp = $('#noteIn'); const v = inp.value.trim(); const id = UI.drawerId; const l = S.leads.get(id);
    if (!v || !l) return;
    patchLead(id, { hist: pushHist(l, { t: Date.now(), k: 'note', txt: v }) });
    inp.value = '';
  });

  // modal
  $('#modalWrap').addEventListener('click', e => { if (e.target.closest('[data-mclose]')) closeModal(); });

  // file
  $('#fileIn').addEventListener('change', e => handleFile(e.target.files && e.target.files[0]));

  // tooltips
  document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else if (!tip.hidden) hideTip(); });
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('scroll', hideTip, true);

  // keys
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if (e.key === 'Escape') {
      if (!$('#modalWrap').hidden) { closeModal(); e.preventDefault(); return; }
      if (UI.drawerId && !(typing && e.target.id === 'quickIn')) { closeDrawer(); e.preventDefault(); return; }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$('#modalWrap').hidden) return;
    if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
    else if ((e.key === 'n' || e.key === 'N') && !S.readOnly) { e.preventDefault(); openNewModal(); }
  });

  addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (VIEWS.includes(h)) setView(h); });
  addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
  addEventListener('pagehide', flushAll);
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); toast('Copiado: ' + s); }
  catch { toast('Não deu para copiar automaticamente: ' + s); }
}
function clearExamples(btn) {
  const ex = all().filter(l => l.exemplo);
  if (!ex.length) return;
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed');
    const old = btn.textContent;
    btn.textContent = `Confirmar: apagar ${ex.length}`;
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = old; } }, 4000);
    return;
  }
  deleteLeads(ex.map(l => l.id), { undo: false });
  toast(`${ex.length} leads de exemplo apagados. O funil é todo seu.`);
}

/* ================= boot ================= */
async function boot() {
  bindStatic();
  scheduleRender();
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    let db = null;
    try { db = await c.use('db'); } catch {}
    if (db) {
      S.db = db; S.mode = 'cloud';
      try {
        const u = await c.use('user');
        if (u && typeof u.can === 'function') { const w = await u.can('data.write'); S.canWrite = w; if (w === false) S.readOnly = true; }
      } catch {}
      subscribe();
      return;
    }
    startLocal('nodb');
    return;
  }
  if (/^https?:$/.test(location.protocol)) { await startApi(); return; }
  startLocal('file');
}
boot();
})();
</script>
