<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101419">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-icon.png">
<title>CRM Shark Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: graphite command rail + bright work surface. The funnel board is the hero; columns read as swim lanes, gold marks money and the next action. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F5F6F8; --lane:#E2E5E9; --lane-2:#D6DADF;
  --ink:#12161B; --ink-2:#465061; --muted:#6F7988; --line:#D9DDE3; --line-2:#C5CBD3;
  --gold:#D49B22; --gold-hi:#E6B443; --gold-ink:#875E0C; --gold-soft:#F7EACB; --on-gold:#1C1404;
  --rail:#101419; --rail-2:#1A2027; --rail-ink:#D9DEE4; --rail-muted:#7D8895;
  --good:#1E8456; --good-soft:#DCF1E6; --warn:#A86A0B; --warn-soft:#FBEED6; --bad:#BE3A33; --bad-soft:#F9E0DD; --on-bad:#FFFFFF; --cold:#56789A;
  --inv-bg:#12161B; --inv-ink:#ECEEF1; --inv-accent:#E6B443;
  --shadow-1:0 1px 2px rgb(16 20 26 / .06), 0 1px 1px rgb(16 20 26 / .04);
  --shadow-2:0 10px 28px -12px rgb(16 20 26 / .28), 0 2px 6px rgb(16 20 26 / .07);
  --shadow-lift:0 24px 46px -14px rgb(16 20 26 / .45), 0 6px 14px rgb(16 20 26 / .14);
  --scrim:rgb(10 13 17 / .42);
  --f-ui:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:12px; --r-sm:8px; --rail-w:84px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E12; --surface:#151A21; --surface-2:#1B2129; --lane:#10151B; --lane-2:#1C232B;
    --ink:#E7EAEE; --ink-2:#B1B9C4; --muted:#808A97; --line:#242B34; --line-2:#333C47;
    --gold:#E0A935; --gold-hi:#F1C25A; --gold-ink:#EDC167; --gold-soft:#33280F; --on-gold:#1C1404;
    --rail:#07090C; --rail-2:#141A21; --rail-ink:#D9DEE4; --rail-muted:#6F7A87;
    --good:#45BF87; --good-soft:#12301F; --warn:#E3A84A; --warn-soft:#33260C; --bad:#F06A61; --bad-soft:#3A1614; --on-bad:#1B0503; --cold:#83A3C4;
    --inv-bg:#E7EAEE; --inv-ink:#12161B; --inv-accent:#875E0C;
    --shadow-1:0 1px 2px rgb(0 0 0 / .45);
    --shadow-2:0 12px 30px -12px rgb(0 0 0 / .7), 0 2px 6px rgb(0 0 0 / .35);
    --shadow-lift:0 26px 50px -12px rgb(0 0 0 / .75), 0 6px 14px rgb(0 0 0 / .4);
    --scrim:rgb(0 0 0 / .58);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E12; --surface:#151A21; --surface-2:#1B2129; --lane:#10151B; --lane-2:#1C232B;
  --ink:#E7EAEE; --ink-2:#B1B9C4; --muted:#808A97; --line:#242B34; --line-2:#333C47;
  --gold:#E0A935; --gold-hi:#F1C25A; --gold-ink:#EDC167; --gold-soft:#33280F; --on-gold:#1C1404;
  --rail:#07090C; --rail-2:#141A21; --rail-ink:#D9DEE4; --rail-muted:#6F7A87;
  --good:#45BF87; --good-soft:#12301F; --warn:#E3A84A; --warn-soft:#33260C; --bad:#F06A61; --bad-soft:#3A1614; --on-bad:#1B0503; --cold:#83A3C4;
  --inv-bg:#E7EAEE; --inv-ink:#12161B; --inv-accent:#875E0C;
  --shadow-1:0 1px 2px rgb(0 0 0 / .45);
  --shadow-2:0 12px 30px -12px rgb(0 0 0 / .7), 0 2px 6px rgb(0 0 0 / .35);
  --shadow-lift:0 26px 50px -12px rgb(0 0 0 / .75), 0 6px 14px rgb(0 0 0 / .4);
  --scrim:rgb(0 0 0 / .58);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.st-novo{--st:var(--muted)}
.st-contato{--st:color-mix(in oklab,var(--gold) 22%,var(--muted))}
.st-aguardando{--st:color-mix(in oklab,var(--gold) 38%,var(--muted))}
.st-reuniao{--st:color-mix(in oklab,var(--gold) 54%,var(--muted))}
.st-diagnostico{--st:color-mix(in oklab,var(--gold) 70%,var(--muted))}
.st-proposta{--st:color-mix(in oklab,var(--gold) 86%,var(--muted))}
.st-negociacao{--st:var(--gold)}
.st-fechado{--st:var(--good)}
.st-perdido{--st:var(--bad)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px 14px;min-height:0}
.brand{display:grid;justify-items:center;gap:4px;margin-bottom:16px;user-select:none}
.brand .mark{width:38px;height:38px}
.brand b{font-stretch:125%;font-weight:800;font-size:10px;letter-spacing:.2em;color:var(--rail-ink);padding-left:.2em}
.nav-btn{position:relative;width:64px;padding:10px 4px 8px;border:0;border-radius:12px;background:transparent;display:grid;justify-items:center;gap:5px;color:var(--rail-muted);font-size:11px;font-weight:650;letter-spacing:.01em;transition:color .15s,background .15s}
.nav-btn .ic{width:22px;height:22px}
.nav-btn:hover{color:var(--rail-ink);background:var(--rail-2)}
.nav-btn[aria-current="page"]{color:var(--gold-hi);background:var(--rail-2)}
.nav-btn[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-badge{position:absolute;top:5px;right:9px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:10.5px;font-weight:750;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;display:grid;justify-items:center;gap:6px;font-size:10.5px;color:var(--rail-muted);text-align:center;line-height:1.2}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--rail-muted)}
.sync-dot.cloud{background:var(--good);box-shadow:0 0 0 3px color-mix(in oklab,var(--good) 25%,transparent)}
.sync-dot.local{background:var(--warn)}
.sync-dot.loading{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{padding:18px 24px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.titles{flex:1 1 220px;min-width:0}
.titles h1{margin:0;font-stretch:125%;font-weight:800;font-size:26px;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
.titles p{margin:3px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 1 auto;justify-content:flex-end}
@media (min-width: 761px){.top-actions{flex-wrap:nowrap}}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px 0 12px;height:40px;width:min(340px,100%);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in oklab,var(--gold) 22%,transparent)}
.search .ic{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;height:100%}
.search kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.filters{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.filters::-webkit-scrollbar{display:none}
.sel{position:relative;display:inline-flex;min-width:0}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.chip-select{appearance:none;-webkit-appearance:none;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 30px 0 13px;font-size:13px;font-weight:550;color:var(--ink-2);max-width:220px;text-overflow:ellipsis}
.chip-select:hover{border-color:var(--line-2)}
.chip-select.on{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;text-decoration:none}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn .ic{width:18px;height:18px}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold);box-shadow:0 8px 18px -10px var(--gold)}
.btn-gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 35%,var(--line))}
.btn-danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn-danger.armed{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--lane-2);color:var(--ink)}
.link-btn{border:0;background:none;color:var(--gold-ink);font-weight:650;font-size:13px;padding:4px 6px;border-radius:6px;white-space:nowrap}
.link-btn:hover{background:var(--gold-soft)}

.banner{margin:12px 24px 0;padding:10px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.banner b{font-weight:700}
.banner.ro{background:var(--surface-2);border:1px solid var(--line)}

.view{flex:1;min-height:0;position:relative;overflow:auto}
.view.is-board{overflow:hidden}

/* ---------- board ---------- */
.board{height:100%;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:16px 24px 18px;align-items:stretch;scroll-padding-inline:24px;overscroll-behavior-x:contain}
.col{flex:0 0 292px;display:flex;flex-direction:column;min-height:0;background:var(--lane);border-radius:16px;transition:background .15s,box-shadow .15s}
.col.is-over{background:color-mix(in oklab,var(--gold) 13%,var(--lane));box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--gold) 55%,transparent)}
.col-h{padding:12px 10px 8px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;column-gap:8px;row-gap:1px}
.col-h .dot{width:9px;height:9px;border-radius:50%;background:var(--st)}
.col-h h2{margin:0;font-size:13.5px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border-radius:10px;padding:1px 8px;font-variant-numeric:tabular-nums}
.col-sum{grid-column:2 / -1;font-size:12px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.col-sum b{color:var(--ink-2);font-weight:600}
.col-list{flex:1;min-height:70px;overflow-y:auto;padding:4px 10px 6px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.col-list:empty::after{content:"Arraste um card para cá";display:grid;place-items:center;min-height:64px;border-radius:12px;border:1.5px solid var(--lane-2);color:var(--muted);font-size:12.5px}
.col-foot{padding:4px 10px 10px}
.quick-btn{width:100%;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:8px 6px;border-radius:9px}
.quick-btn .ic{width:16px;height:16px}
.quick-btn:hover{background:var(--lane-2);color:var(--ink)}
.quick-form{display:grid;gap:8px}
.quick-form .qf-actions{display:flex;gap:6px}

.card{outline:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:var(--r)}
.card-in{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 10px;display:grid;gap:7px;box-shadow:var(--shadow-1);transition:border-color .15s,box-shadow .2s,transform .2s}
.card:hover .card-in{border-color:var(--line-2);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.card:focus-visible .card-in{outline:2px solid var(--gold);outline-offset:1px}
.card.is-chosen .card-in{border-color:var(--gold)}
.card.is-ghost{background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold)}
.card.is-ghost .card-in{visibility:hidden}
.card.is-fallback{opacity:1!important;z-index:100}
.card.is-fallback .card-in{transform:rotate(2.5deg) scale(1.035);box-shadow:var(--shadow-lift);border-color:var(--gold);transition:none}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
body.is-dragging .board{scroll-snap-type:none!important}
.c-top{display:flex;align-items:flex-start;gap:8px}
.c-name{margin:0;font-size:14px;font-weight:680;line-height:1.28;flex:1;min-width:0;overflow-wrap:anywhere}
.c-sub{margin:-4px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:620;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.ex{background:transparent;border-style:solid;color:var(--muted);font-weight:600}
.c-loss{margin:0;font-size:12px;color:var(--bad);background:var(--bad-soft);padding:4px 8px;border-radius:7px}
.c-foot{display:flex;align-items:center;gap:6px;min-height:22px}
.c-fee{font-family:var(--f-mono);font-size:12px;font-weight:600;margin-right:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-fee small{color:var(--muted);font-weight:400;font-size:11px}
.c-stale{font-size:11px;color:var(--warn);font-weight:650;white-space:nowrap}
.flag{display:inline-grid;place-items:center;height:18px;min-width:18px;padding:0 4px;border-radius:5px;font-size:10.5px;font-weight:800;background:var(--warn-soft);color:var(--warn)}
.due{display:inline-flex;align-items:center;font-size:11px;font-weight:680;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.due.late{background:var(--bad-soft);color:var(--bad)}
.due.today{background:var(--gold-soft);color:var(--gold-ink)}
.due.soon{background:var(--surface-2);color:var(--ink)}
.due.none{background:transparent;color:var(--muted);font-weight:550;padding:2px 0}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--rail);color:var(--gold-hi);font-size:9.5px;font-weight:800;display:inline-grid;place-items:center;letter-spacing:.02em;flex:none}
.temp{display:inline-flex;align-items:flex-end;gap:2px;height:13px;padding-top:2px;flex:none}
.temp i{display:block;width:3.5px;border-radius:1.5px;background:var(--line-2)}
.temp i:nth-child(1){height:5px}.temp i:nth-child(2){height:8px}.temp i:nth-child(3){height:11px}
.t-frio i:nth-child(1){background:var(--cold)}
.t-morno i:nth-child(-n+2){background:var(--warn)}
.t-quente i{background:var(--bad)}
@keyframes wonPop{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes sweep{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(260%) skewX(-18deg)}}
.won-flash .card-in{position:relative;overflow:hidden;border-color:var(--gold);animation:wonPop .6s cubic-bezier(.2,.8,.2,1)}
.won-flash .card-in::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(90deg,transparent,rgb(255 210 110 / .55),transparent);animation:sweep 1.1s .1s ease-out both;pointer-events:none}

.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px 16px;pointer-events:none}
.empty-card{pointer-events:auto;max-width:440px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 26px;box-shadow:var(--shadow-2);display:grid;gap:12px;justify-items:start}
.empty-card .mark{width:48px;height:48px}
.empty-card h2{margin:0;font-stretch:122%;font-weight:800;font-size:22px;line-height:1.15}
.empty-card p{margin:0;color:var(--ink-2);max-width:52ch}
.empty-card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* ---------- list ---------- */
.pad{padding:16px 24px 32px}
.seg{display:inline-flex;background:var(--lane);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:620;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg button .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-left:4px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:12px}
table.tbl{border-collapse:collapse;width:100%;min-width:1040px;font-size:13px}
.tbl th{background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;padding:10px 12px;width:100%;text-align:left;display:flex;gap:4px;align-items:center}
.tbl th button:hover{color:var(--ink)}
.tbl th button[aria-sort="ascending"]::after{content:"↑";color:var(--gold-ink)}
.tbl th button[aria-sort="descending"]::after{content:"↓";color:var(--gold-ink)}
.tbl th.r button{justify-content:flex-end}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.r{text-align:right}
.cell-lead b{display:block;font-weight:680;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-lead span{display:block;color:var(--muted);font-size:12.5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-2{white-space:nowrap}
.cell-2 span{display:block;color:var(--muted);font-size:12px}
.wa{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;padding:3px 6px;margin:-3px -6px;border-radius:6px}
.wa:hover{background:var(--good-soft);color:var(--good)}
.wa .ic{width:15px;height:15px;color:var(--good)}
.mini-sel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:28px;padding:0 26px 0 10px;font-size:12px;font-weight:620;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:2px 9px 2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st,var(--muted))}
.empty-row{padding:36px 16px;text-align:center;color:var(--muted)}

/* ---------- retornos ---------- */
.agenda{display:grid;gap:22px;max-width:1040px}
.ag-group{display:grid;gap:8px}
.ag-group > h2{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:750;display:flex;gap:8px;align-items:center}
.ag-group > h2 .count{background:var(--lane)}
.ag-group.late > h2{color:var(--bad)}
.ag-group.today > h2{color:var(--gold-ink)}
.ag-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ag-main{min-width:0;display:grid;gap:3px}
.ag-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ag-name{border:0;background:none;padding:0;font-weight:700;font-size:14.5px;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.ag-name:hover{color:var(--gold-ink);text-decoration:underline;text-underline-offset:3px}
.ag-sub{margin:0;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-note{margin:2px 0 0;color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn-wa{border-color:color-mix(in oklab,var(--good) 45%,var(--line));color:var(--good)}
.btn-wa:hover{background:var(--good-soft);border-color:var(--good)}
.done-grp{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.done-grp > span{font-size:11.5px;color:var(--muted);padding:0 6px 0 6px;font-weight:600;white-space:nowrap}
.done-grp button{border:0;background:var(--surface);border-radius:7px;height:26px;min-width:34px;padding:0 8px;font-size:12px;font-weight:700;font-family:var(--f-mono);box-shadow:var(--shadow-1)}
.done-grp button:hover{background:var(--gold);color:var(--on-gold)}
.ag-empty{color:var(--muted);font-size:13px;padding:2px 2px}

/* ---------- painel ---------- */
.dash{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 15px;display:grid;gap:3px;align-content:start;min-width:0}
.kpi .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:720}
.kpi .val{font-size:clamp(24px,1.4vw + 12px,30px);font-weight:720;letter-spacing:-.02em;line-height:1.12}
.kpi .val small{display:inline-block;font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .cap{font-size:12.5px;color:var(--ink-2)}
.kpi.hero{background:var(--rail);border-color:var(--rail);color:var(--rail-ink)}
.kpi.hero .lbl{color:var(--rail-muted)}
.kpi.hero .val{color:var(--gold-hi);font-stretch:112%}
.kpi.hero .val small{color:var(--rail-muted)}
.kpi.hero .cap{color:var(--rail-ink)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.panel.wide{grid-column:1 / -1}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel h3{margin:0;font-size:14px;font-weight:720}
.panel .note{margin:0;font-size:12px;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(84px,40%) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;padding:2px 0;border-radius:6px}
.bar-row .bl{display:flex;align-items:center;gap:7px;min-width:0}
.bar-row .bl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bl i{width:8px;height:8px;border-radius:50%;background:var(--st);flex:none}
.bar-row .bt{height:8px;background:var(--lane);border-radius:4px;overflow:hidden}
.bar-row .bt i{display:block;height:100%;background:var(--gold);border-radius:0 4px 4px 0;min-width:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar-row .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.bar-row .bv small{font-weight:500;color:var(--muted);margin-left:5px;font-size:11.5px}
.no-data{margin:0;color:var(--muted);font-size:13px}
.cc{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px}
.cc-y{display:flex;flex-direction:column;justify-content:space-between;height:170px;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;margin-top:-6px;padding-bottom:0}
.cc-y span{line-height:12px}
.cc-plot{position:relative;height:170px;border-bottom:1px solid var(--line-2)}
.cc-plot .gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.cc-cols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.cc-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px 4px 0 0;cursor:default;outline:none}
.cc-col:hover,.cc-col:focus-visible{background:color-mix(in oklab,var(--gold) 9%,transparent)}
.cc-col i{display:block;width:min(70%,34px);background:var(--gold);border-radius:4px 4px 0 0;min-height:0}
.cc-x{grid-column:2;display:flex;gap:2px;font-size:11px;color:var(--muted);margin-top:6px}
.cc-x span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
.q-list{display:grid;gap:6px}
.q-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:13px;text-align:left;width:100%}
.q-item:hover{border-color:var(--line-2)}
.q-item b{font-family:var(--f-mono);font-size:14px;min-width:28px;font-variant-numeric:tabular-nums}
.q-item.ok b{color:var(--good)}
.q-item.warn b{color:var(--warn)}

/* ---------- ajustes ---------- */
.settings{display:grid;gap:16px;max-width:1120px}
.settings h2{margin:6px 0 0;font-stretch:118%;font-weight:800;font-size:17px}
.opt-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.opt{display:inline-flex;align-items:center;gap:2px;padding:3px 3px 3px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;cursor:grab;user-select:none}
.opt button{border:0;background:none;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.opt button:hover{background:var(--bad-soft);color:var(--bad)}
.opt button .ic{width:14px;height:14px}
.opt.is-ghost{opacity:.35}
.add-row{display:flex;gap:6px}
.add-row .inp{height:34px}
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.data-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start}
.data-card h3{margin:0;font-size:14px;font-weight:720}
.data-card p{margin:0;color:var(--ink-2);font-size:13px}
.data-card .btn{justify-self:start;margin-top:4px}
.store-note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.store-note .sync-dot{margin-top:5px;flex:none}
.store-note a{color:var(--gold-ink);font-weight:650}

/* ---------- forms ---------- */
.field{display:grid;gap:5px;min-width:0}
.field > span,.lbl-s{font-size:11px;font-weight:720;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:14px;padding:0 11px;transition:border-color .15s,box-shadow .15s,background .15s;min-width:0}
.inp:hover{border-color:var(--line-2)}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in oklab,var(--gold) 22%,transparent);background:var(--surface)}
.inp[disabled]{opacity:.7}
textarea.inp{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.45}
select.inp{appearance:none;-webkit-appearance:none;padding-right:30px}
.sel.block{display:flex}
.affix{position:relative;display:flex}
.affix > b{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--muted);font-weight:600;pointer-events:none}
.affix .inp{padding-left:32px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:30px;padding:0 12px;font-size:12.5px;font-weight:620;color:var(--ink-2);transition:all .12s}
.chk:hover{border-color:var(--line-2);color:var(--ink)}
.chk[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.chk.loss[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
.temp-seg{display:inline-flex;gap:4px}
.temp-seg button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:30px;padding:0 10px;font-size:12.5px;font-weight:620;color:var(--ink-2)}
.temp-seg button[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink);background:var(--surface-2)}
.hint{margin:0;font-size:12px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--gold)}

/* ---------- drawer ---------- */
.drawer-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);box-shadow:var(--shadow-lift);display:flex;flex-direction:column;animation:slideIn .28s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes fade{from{opacity:0}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
.d-head{padding:16px 22px 12px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.d-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-height:32px}
.d-meta .grow{flex:1}
.d-title{border:1px solid transparent;background:transparent;border-radius:9px;margin:0 -9px;padding:2px 8px;font-stretch:118%;font-weight:800;font-size:24px;line-height:1.2;width:calc(100% + 18px);min-width:0}
.d-title:hover{background:var(--surface-2)}
.d-title:focus{outline:none;border-color:var(--gold);background:var(--surface)}
.d-subtitle{border:1px solid transparent;background:transparent;border-radius:8px;margin:-4px -9px 0;padding:2px 8px;font-size:15px;color:var(--ink-2);width:calc(100% + 18px);min-width:0}
.d-subtitle:hover{background:var(--surface-2)}
.d-subtitle:focus{outline:none;border-color:var(--gold);background:var(--surface)}
.d-quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.d-stages{position:relative;display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;padding:12px 22px;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none}
.d-stages::-webkit-scrollbar{display:none}
.stp{flex:none;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:640;color:var(--ink-2);white-space:nowrap}
.stp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st)}
.stp:hover{border-color:var(--line-2);color:var(--ink)}
.stp.past{background:var(--surface-2)}
.stp.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stp.on.st-fechado{background:var(--good);border-color:var(--good);color:var(--surface)}
.stp.on.st-perdido{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.stp.on::before{box-shadow:0 0 0 2px var(--surface)}
.d-scroll{flex:1;overflow-y:auto;padding:4px 22px 28px;overscroll-behavior:contain}
.d-sec{display:grid;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.d-sec:last-child{border-bottom:0}
.d-sec > h4{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);font-weight:780}
.d-loss{display:grid;gap:8px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);margin-top:14px}
.d-loss p{margin:0;font-size:13px;color:var(--ink)}
.date-quick{display:flex;gap:4px;flex-wrap:wrap}
.date-quick button{border:1px solid var(--line);background:var(--surface);border-radius:7px;height:26px;padding:0 8px;font-size:12px;font-weight:650;color:var(--ink-2)}
.date-quick button:hover{border-color:var(--gold);color:var(--ink)}
.note-row{display:flex;gap:8px}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;position:relative;padding-bottom:12px}
.tl li::before{content:"";position:absolute;left:6px;top:15px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .b{width:9px;height:9px;border-radius:50%;margin:5px 0 0 2px;background:var(--line-2)}
.tl li.k-note .b{background:var(--gold)}
.tl li.k-stage .b{background:var(--st,var(--ink-2))}
.tl li.k-retorno .b{background:var(--good)}
.tl .t{font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.tl .w{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;flex-wrap:wrap}

/* ---------- modal & toast & tip ---------- */
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal{position:relative;width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lift);padding:22px 22px 20px;display:grid;gap:14px;animation:pop .24s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal h3{margin:0;font-stretch:118%;font-weight:800;font-size:20px;line-height:1.2;text-wrap:balance}
.modal p{margin:0}
.m-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.pv{display:grid;gap:6px}
.pv-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13px;background:var(--surface-2);border-radius:9px;padding:7px 10px}
.pv-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.pv-row span.mono{font-size:12px;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--lane);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
/* ---------- orçamento ---------- */
.modal.wide{width:min(720px,100%)}
.qt{display:grid;gap:14px}
.qt-items{display:grid;gap:6px}
.qt-row{display:grid;grid-template-columns:minmax(0,1fr) 128px 128px;gap:8px;align-items:center}
.qt-row > b{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt-row .edited{color:var(--gold-ink);font-weight:700;margin-left:4px}
.qt-row.head > span{font-size:11px;font-weight:720;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.qt-row .inp{height:34px}
.qt-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--inv-bg);color:var(--inv-ink);border-radius:14px;padding:14px}
.qt-sum div{display:grid;gap:2px;min-width:0}
.qt-sum span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;opacity:.7}
.qt-sum b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;color:var(--inv-accent);overflow-wrap:anywhere}
.qt-check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.price-table{display:grid;gap:6px}
.price-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px;gap:8px;align-items:center;font-size:13.5px}
.price-row.two{grid-template-columns:minmax(0,1fr) 120px}
.price-row > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price-row.head > span{font-size:11px;font-weight:720;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.price-row .inp{height:34px;font-family:var(--f-mono)}
.toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:70;width:min(460px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--inv-bg);color:var(--inv-ink);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-2);font-size:13.5px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.toast span{flex:1;min-width:0}
.toast button{border:0;background:none;color:var(--inv-accent);font-weight:750;padding:5px 9px;border-radius:7px;white-space:nowrap}
.toast button:hover{background:color-mix(in oklab,var(--inv-accent) 18%,transparent)}
.toast.bad{background:var(--bad);color:var(--on-bad)}
.toast.bad button{color:var(--on-bad)}
.toast.won{background:var(--gold);color:var(--on-gold);font-weight:650}
.toast.won button{color:var(--on-gold)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--inv-bg);color:var(--inv-ink);font-size:12px;padding:6px 9px;border-radius:7px;box-shadow:var(--shadow-2);max-width:260px;white-space:pre-line;font-variant-numeric:tabular-nums}

body.ro .needs-write{display:none!important}

/* ---------- login & conta ---------- */
.login{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px 16px;background:var(--rail);color:var(--rail-ink);overflow:auto}
.login::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 70% 20%,color-mix(in oklab,var(--gold) 16%,transparent),transparent 70%);pointer-events:none}
.login-card{position:relative;width:min(420px,100%);display:grid;gap:16px;justify-items:start}
.login-card .mark{width:56px;height:56px}
.login-card h1{margin:0;font-stretch:125%;font-weight:800;font-size:30px;line-height:1.08;letter-spacing:-.01em;color:#F1F3F5}
.login-card p{margin:0;color:var(--rail-ink);opacity:.82;max-width:44ch}
.g-btn{display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 20px 0 14px;border-radius:12px;border:0;background:#FFFFFF;color:#1F1F1F;font-weight:650;font-size:15px;text-decoration:none;box-shadow:0 10px 30px -12px rgb(0 0 0 / .6)}
.g-btn:hover{background:#F2F2F2}
.g-btn svg{width:20px;height:20px}
.login-msg{padding:10px 14px;border-radius:10px;background:color-mix(in oklab,var(--bad) 22%,transparent);color:#FFE3E0;font-size:13.5px;max-width:44ch}
.login-msg.info{background:color-mix(in oklab,var(--gold) 18%,transparent);color:#FCEFD2}
.login-msg code{font-family:var(--f-mono);font-size:12px}
.login-foot{font-size:12px;color:var(--rail-muted)}
.me-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--rail-2);background:var(--rail-2);color:var(--gold-hi);font-weight:800;font-size:11px;margin-bottom:4px}
.me-btn:hover{border-color:var(--gold)}
.account{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.account b{color:var(--ink)}
.account .grow{flex:1}

/* ---------- responsive ---------- */
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = v => String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const clone = o => JSON.parse(JSON.stringify(o));
const uniq = a => [...new Set(a.filter(x => x != null && x !== ''))];
const uid = () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
const num = v => (typeof v === 'number' && isFinite(v)) ? v : (parseFloat(v) || 0);

const I = {
  plus: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  wa: '<svg class="ic" viewBox="0 0 24 24"><path d="M20 11.6a8.1 8.1 0 0 1-11.9 7.1L4 20l1.4-3.9A8.1 8.1 0 1 1 20 11.6z"/><path d="M9.2 8.6c.2 2.9 3.2 5.9 6.1 6.1"/></svg>',
  copy: '<svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
  up: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  down: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>',
  quote: '<svg class="ic" viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9.5 8h5M9.5 12h5"/></svg>',
  open: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  mark: '<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 29C11 26.6 16 17 25 6c-2.4 9.4-.8 17.2 8 23z" fill="var(--gold)"/><path d="M4 34c2.4 0 2.4-1.6 4.8-1.6S11.2 34 13.6 34s2.4-1.6 4.8-1.6S20.8 34 23.2 34s2.4-1.6 4.8-1.6S30.4 34 32.8 34s2.4-1.6 4.8-1.6" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>'
};

/* ================= domain ================= */
const STAGES = [
  { k: 'novo', n: 'Novo lead' },
  { k: 'contato', n: 'Primeiro contato' },
  { k: 'aguardando', n: 'Aguardando retorno' },
  { k: 'reuniao', n: 'Reunião agendada' },
  { k: 'diagnostico', n: 'Reunião realizada' },
  { k: 'proposta', n: 'Proposta enviada' },
  { k: 'negociacao', n: 'Negociação' },
  { k: 'fechado', n: 'Fechado', won: true },
  { k: 'perdido', n: 'Perdido', lost: true }
];
const STAGE = Object.fromEntries(STAGES.map((s, i) => [s.k, { ...s, i }]));
const OPEN = STAGES.filter(s => !s.won && !s.lost).map(s => s.k);
const isOpen = l => OPEN.includes(l.stage);
const QUALIFIED = ['diagnostico', 'proposta', 'negociacao', 'fechado'];
const TEMPS = [{ k: 'frio', n: 'Frio' }, { k: 'morno', n: 'Morno' }, { k: 'quente', n: 'Quente' }];
const DEFAULT_CFG = {
  servicos: ['Tráfego Pago', 'Social Media', 'Landing Page', 'Site', 'Identidade Visual', 'Produção de Vídeo', 'Gestão 360', 'Consultoria', 'SEO', 'Automação / CRM'],
  canais: ['Tráfego pago', 'Site', 'Orgânico', 'Indicação', 'WhatsApp', 'Prospecção ativa', 'Outro', 'Não informado'],
  origens: ['Google Ads', 'Meta Ads - Facebook', 'Meta Ads - Instagram', 'Site', 'Instagram orgânico', 'Indicação', 'WhatsApp', 'Prospecção ativa', 'Evento', 'Outro', 'Não informado'],
  nichos: ['Advocacia', 'Saúde', 'Estética e beleza', 'Alimentação', 'Varejo', 'Imobiliário', 'Educação', 'Energia solar', 'Serviços locais', 'Outro'],
  resps: ['Vinicius'],
  perdas: ['Sem orçamento', 'Fechou com outra agência', 'Sem resposta', 'Desqualificado', 'Adiou a decisão', 'Vai fazer por conta própria', 'Outro'],
  // Orçamento: "Serviço | setup | mensal" e "Nicho | ajuste %". Editados em Ajustes → Tabela de preços.
  precos: ['Tráfego Pago | 500 | 1500', 'Social Media | 0 | 1800', 'Landing Page | 1800 | 0', 'Site | 3500 | 0', 'Identidade Visual | 2500 | 0', 'Produção de Vídeo | 0 | 1200', 'Gestão 360 | 1000 | 4500', 'Consultoria | 1500 | 0', 'SEO | 800 | 1200', 'Automação / CRM | 1500 | 300'],
  fatores: ['Advocacia | 15', 'Saúde | 15', 'Imobiliário | 10', 'Energia solar | 10']
};
const LISTS = [
  ['servicos', 'Serviços', 'O que a agência vende. Aparece nos cards e no painel.'],
  ['canais', 'Canais de entrada', 'Por onde o lead chegou até a Shark.'],
  ['origens', 'Origem detalhada', 'Campanha ou fonte específica do lead.'],
  ['nichos', 'Nichos', 'Segmento do negócio do cliente.'],
  ['resps', 'Responsáveis', 'Quem cuida do lead.'],
  ['perdas', 'Motivos de perda', 'Pedidos quando um lead vai para Perdido.']
];
/* orçamento: tabela de preços e ajuste por nicho */
const SCOPES = [
  { k: 'enxuto', n: 'Enxuto', pct: -15, d: 'Escopo reduzido, menos entregas' },
  { k: 'padrao', n: 'Padrão', pct: 0, d: 'Escopo normal da agência' },
  { k: 'completo', n: 'Completo', pct: 30, d: 'Mais entregas, mais volume' }
];
const MONTHS = [1, 3, 6, 12];
const splitCfg = s => String(s).split('|').map(x => x.trim());
function priceTable(cfg = S.cfg) {
  const m = new Map();
  for (const line of cfg.precos || []) { const [n, a, b] = splitCfg(line); if (n) m.set(norm(n), { setup: parseMoney(a), fee: parseMoney(b) }); }
  return m;
}
function nicheTable(cfg = S.cfg) {
  const m = new Map();
  for (const line of cfg.fatores || []) {
    const [n, a] = splitCfg(line);
    const v = parseFloat(String(a ?? '').replace(',', '.').replace('%', ''));
    if (n && isFinite(v)) m.set(norm(n), Math.max(-90, Math.min(500, v)));
  }
  return m;
}
const priceOf = s => priceTable().get(norm(s)) || { setup: 0, fee: 0 };
const nichePct = n => nicheTable().get(norm(n)) || 0;
const roundPrice = v => Math.max(0, Math.round(v / 10) * 10);
const signPct = v => (v > 0 ? '+' : '') + NUMF.format(v) + '%';

function fixCfg(c) {
  const out = {};
  for (const k of Object.keys(DEFAULT_CFG)) {
    const v = c && Array.isArray(c[k]) ? uniq(c[k].map(x => String(x).trim())) : null;
    out[k] = v && v.length ? v : DEFAULT_CFG[k].slice();
  }
  return out;
}

/* dates */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const fmtDM = s => { const d = parseYmd(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const fmtDMY = s => { if (!s) return ''; const d = parseYmd(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`; };
const fmtTs = t => { const d = new Date(t); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function dueInfo(s) {
  if (!s) return null;
  const n = diffDays(s, today());
  if (n < 0) return { cls: 'late', txt: n === -1 ? 'Ontem' : `Atrasado ${-n}d` };
  if (n === 0) return { cls: 'today', txt: 'Hoje' };
  if (n === 1) return { cls: 'soon', txt: 'Amanhã' };
  if (n < 7) return { cls: 'soon', txt: `${WD[parseYmd(s).getDay()]} ${fmtDM(s)}` };
  return { cls: '', txt: fmtDM(s) };
}

/* money */
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const NUMF = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
const money = v => BRL.format(num(v));
function moneyShort(v) {
  v = num(v);
  if (v >= 1e6) return 'R$ ' + (v / 1e6).toFixed(1).replace('.', ',') + ' mi';
  if (v >= 1e5) return 'R$ ' + Math.round(v / 1e3) + ' mil';
  return money(v);
}
function parseMoney(s) {
  if (typeof s === 'number') return isFinite(s) ? Math.max(0, s) : 0;
  s = String(s ?? '').replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? Math.max(0, Math.round(n * 100) / 100) : 0;
}
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '0%';

/* phones: same rules as the office sheet (E.164 + 9th digit rebuild) */
function phoneInfo(raw, e164hint) {
  const s = String(raw ?? '').trim();
  let d = s.replace(/\D/g, '');
  if (!d && e164hint) return phoneInfo(e164hint);
  if (!d) return { e164: '', warn: '' };
  if (s.startsWith('+') && !d.startsWith('55')) {
    return d.length >= 8 && d.length <= 15 ? { e164: '+' + d, warn: '' } : { e164: '', warn: 'Número internacional incompleto' };
  }
  d = d.replace(/^0+/, '');
  if (d.startsWith('55') && d.length >= 12) d = d.slice(2);
  let warn = '';
  if (d.length === 10 && '6789'.includes(d[2])) { d = d.slice(0, 2) + '9' + d.slice(2); warn = '9º dígito incluído automaticamente. Confirme no WhatsApp.'; }
  if (d.length === 11 || d.length === 10) return { e164: '+55' + d, warn };
  return { e164: '', warn: 'Número incompleto: confira o DDD e os dígitos' };
}
function fmtPhone(e164) {
  if (!e164) return '';
  const m = e164.match(/^\+55(\d{2})(\d{4,5})(\d{4})$/);
  return m ? `(${m[1]}) ${m[2]}-${m[3]}` : e164;
}
const waUrl = l => l.e164 ? 'https://wa.me/' + l.e164.replace(/\D/g, '') : '';
const nm = l => l.empresa || l.contato || 'Lead sem nome';
const initials = s => { const p = String(s || '').trim().split(/\s+/).filter(Boolean); if (!p.length) return '?'; return (p.length === 1 ? p[0].slice(0, 2) : p[0][0] + p[p.length - 1][0]).toUpperCase(); };
const tempHTML = t => { const k = TEMPS.some(x => x.k === t) ? t : 'morno'; return `<span class="temp t-${k}" title="Temperatura: ${TEMPS.find(x => x.k === k).n}" aria-label="Temperatura ${TEMPS.find(x => x.k === k).n}"><i></i><i></i><i></i></span>`; };

/* ================= state ================= */
const S = {
  mode: 'loading', ready: false, db: null, readOnly: false, canWrite: null, localReason: '',
  me: null, sheetUrl: '', ver: null, epoch: 0, busy: 0,
  leads: new Map(), cfg: clone(DEFAULT_CFG),
  overlay: new Map(), inflight: new Map(), chains: new Map(), timers: new Map(), creating: new Set(), deleted: new Set()
};
const VIEWS = ['funil', 'lista', 'retornos', 'painel', 'ajustes'];
const savedUI = LS.get('sharkcrm.ui', {}) || {};
const UI = {
  view: VIEWS.includes(savedUI.view) ? savedUI.view : 'funil',
  q: '', fResp: savedUI.fResp || '', fServ: savedUI.fServ || '', fCanal: savedUI.fCanal || '',
  period: savedUI.period || '90', listTab: savedUI.listTab || 'todos', sort: savedUI.sort || { k: 'num', dir: -1 },
  drawerId: null, dragging: false, renderAfterDrag: false, justDragged: false, sortables: [], quick: null, flash: null, filtersKey: ''
};
{ const h = location.hash.replace('#', ''); if (VIEWS.includes(h)) UI.view = h; }
const persistUI = () => LS.set('sharkcrm.ui', { view: UI.view, fResp: UI.fResp, fServ: UI.fServ, fCanal: UI.fCanal, period: UI.period, listTab: UI.listTab, sort: UI.sort });

const all = () => [...S.leads.values()].filter(l => !S.deleted.has(l.id));
const maxNum = () => all().reduce((m, l) => Math.max(m, num(l.num)), 0);
function filtered() {
  const q = norm(UI.q);
  return all().filter(l =>
    (!UI.fResp || l.resp === UI.fResp) &&
    (!UI.fServ || (l.servicos || []).includes(UI.fServ)) &&
    (!UI.fCanal || l.canal === UI.fCanal) &&
    (!q || norm([l.empresa, l.contato, l.whats, l.e164, fmtPhone(l.e164), l.email, l.insta, l.cidade, l.nicho, l.demanda, l.obs, '#' + l.num].join(' ')).includes(q)));
}
function dupPhones() {
  const c = new Map();

let slots = 0; const waiters = [];
async function withSlot(fn) {
  if (slots >= 4) await new Promise(r => waiters.push(r));
  slots++;
  try { return await fn(); } finally { slots--; const w = waiters.shift(); if (w) w(); }
}
async function dbWrite(fn) {
  for (let tries = 0; ; tries++) {
    try { return await withSlot(fn); }
    catch (e) {
      const c = e && e.code;
      if ((c === 'unavailable' && tries < 1) || (c === 'resource_exhausted' && tries < 3)) { await sleep(500 * (tries + 1) + Math.random() * 500); continue; }
      throw e;
    }
  }
}
const remote = () => S.mode === 'cloud' || S.mode === 'api';
// One shape for both remote stores: the claude.ai artifact db and the site's /api/crm (Google Sheets).
const R = {
  create: (id, body) => S.mode === 'api' ? api('POST', { action: 'create', leads: [{ ...body, id }] }) : S.db.doc('leads/' + id).set(body),
  update: (id, p) => S.mode === 'api' ? api('POST', { action: 'patch', id, fields: p }) : S.db.doc('leads/' + id).update(p),
  remove: ids => S.mode === 'api' ? api('POST', { action: 'delete', ids }) : Promise.all(ids.map(id => S.db.doc('leads/' + id).delete())),
  saveCfg: cfg => S.mode === 'api' ? api('POST', { action: 'saveCfg', cfg }) : S.db.doc('config/lists').set(cfg)
};
function chain(key, step) {
  S.busy++;
  const p = (S.chains.get(key) || Promise.resolve()).then(step).catch(onWriteErr).finally(() => { S.busy--; afterWrite(); });
  S.chains.set(key, p);
  return p;
}
let lastErrToast = 0;
function onWriteErr(e) {
  console.warn('[CRM] falha ao salvar', e);
  const c = e && e.code;
  if (c === 'unauthenticated') return; // the login screen is already showing
  if (c === 'invalid_argument' && S.canWrite == null && !S.readOnly) {
    S.readOnly = true; scheduleRender();
    toast('Este CRM está aberto só para leitura na sua conta.', { tone: 'bad', ms: 7000 });
    return;
  }
  if (c === 'revoked' || c === 'not_granted' || c === 'forbidden') { S.readOnly = true; scheduleRender(); toast('Seu acesso de edição foi removido. O CRM ficou em modo leitura.', { tone: 'bad', ms: 7000 }); return; }
  if (S.mode === 'api') schedulePull(800);
  if (Date.now() - lastErrToast < 3000) return;
  lastErrToast = Date.now();
  if (c === 'quota_exceeded') toast('O banco do CRM chegou no limite. Exporte um backup e apague leads antigos.', { tone: 'bad', ms: 9000 });
  else if (e && e.message && S.mode === 'api' && c !== 'unavailable') toast('Não salvou: ' + e.message, { tone: 'bad', ms: 8000 });
  else toast('Não consegui salvar a última alteração. Confira a conexão e tente de novo.', { tone: 'bad', ms: 6000 });
}

function createLead(data) {
  const id = data.id || uid();
  const l = { ...data, id };
  S.deleted.delete(id);
  S.leads.set(id, l);
  if (remote()) {
    S.creating.add(id);
    const body = { ...l }; delete body.id;
    chain(id, () => dbWrite(() => R.create(id, body))).finally(() => S.creating.delete(id));
  } else saveLocal();
  scheduleRender();
  return id;
}
function patchLead(id, p, delay = 0) {
  const cur = S.leads.get(id);
  if (!cur || S.readOnly) return;
  p = { ...p, updatedAt: Date.now() };
  S.leads.set(id, { ...cur, ...p });
  if (remote()) {
    S.overlay.set(id, { ...(S.overlay.get(id) || {}), ...p });
    clearTimeout(S.timers.get(id));
    S.timers.set(id, setTimeout(() => flushLead(id), delay));
  } else saveLocal();
  scheduleRender();
}
function flushLead(id) {
  clearTimeout(S.timers.get(id)); S.timers.delete(id);
  if (!remote() || !S.overlay.has(id)) return;
  chain(id, async () => {
    const ov = S.overlay.get(id);
    if (!ov || S.deleted.has(id)) return;
    S.overlay.delete(id); S.inflight.set(id, ov);
    try { await dbWrite(() => R.update(id, ov)); }
    finally { if (S.inflight.get(id) === ov) S.inflight.delete(id); }
  });
}
const flushAll = () => { for (const id of [...S.timers.keys()]) flushLead(id); };
function deleteLeads(ids, { undo = true } = {}) {
  const gone = ids.map(id => S.leads.get(id)).filter(Boolean);
  if (!gone.length) return;
  for (const l of gone) {
    clearTimeout(S.timers.get(l.id)); S.timers.delete(l.id); S.overlay.delete(l.id);
    S.leads.delete(l.id); S.deleted.add(l.id);
    if (UI.drawerId === l.id) closeDrawer();
  }
  if (remote()) {
    const list = gone.map(l => l.id);
    chain(list.length === 1 ? list[0] : '__bulk', () => dbWrite(() => R.remove(list)));
  } else saveLocal();
  scheduleRender();
  if (undo && gone.length === 1) toast(`“${nm(gone[0])}” foi excluído`, { action: 'Desfazer', onAction: () => createLead({ ...gone[0] }) });
}
const deleteLead = (id, opts) => deleteLeads([id], opts);
function saveCfg(cfg) {
  S.cfg = fixCfg(cfg);
  UI.filtersKey = '';
  if (remote()) { const body = clone(S.cfg); chain('__cfg', () => dbWrite(() => R.saveCfg(body))); }
  else saveLocal();

}

/* claude.ai artifact: live database */
function subscribe() {
  S.db.collection('leads').onSnapshot(snap => {
    const next = new Map();
    for (const d of snap.docs) {
      if (!d.exists || S.deleted.has(d.id)) continue;
      next.set(d.id, { ...d.data(), ...(S.inflight.get(d.id) || {}), ...(S.overlay.get(d.id) || {}), id: d.id });
    }
    for (const id of S.creating) if (!next.has(id) && S.leads.has(id)) next.set(id, S.leads.get(id));
    S.leads = next;
    if (!S.ready) { S.ready = true; setSync('cloud'); }
    scheduleRender();
  }, err => onSubErr(err));
  S.db.doc('config/lists').onSnapshot(d => {
    if (d.exists) { S.cfg = fixCfg(d.data()); UI.filtersKey = ''; scheduleRender(); }
  }, err => onSubErr(err));
}
let resubT = 0;
function onSubErr(err) {
  console.warn('[CRM] assinatura encerrada', err);
  const c = err && err.code;
  if (c === 'revoked') { S.readOnly = true; scheduleRender(); return; }
  if (c === 'unavailable') { clearTimeout(resubT); resubT = setTimeout(subscribe, 2500); return; }
  toast('Perdi a conexão com o banco do CRM. Recarregue a página.', { tone: 'bad', ms: 9000 });

/* site: /api/crm on top of the Google Sheet */
const API = '/api/crm';
async function api(method, body, path = '/data') {
  let r;
  try {
    r = await fetch(API + path, { method, headers: { 'Content-Type': 'application/json', 'X-CRM-Request': '1' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', credentials: 'same-origin' });
  } catch { throw { code: 'unavailable', message: 'Sem conexão com o servidor' }; }
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401) { showLogin('expirou'); throw { code: 'unauthenticated' }; }
  if (r.status === 403) throw { code: 'forbidden' };
  if (r.status === 429) throw { code: 'resource_exhausted', message: j.message };
  if (!r.ok || j.ok === false) throw { code: r.status >= 500 && !j.message ? 'unavailable' : (j.code || 'error'), message: j.message || '' };
  return j;
}
let pullT = 0, pulling = false;
function schedulePull(ms) { clearTimeout(pullT); pullT = setTimeout(pull, ms); }
function afterWrite() {
  if (S.mode !== 'api') return;
  S.epoch++;
  if (!S.busy) schedulePull(1200);
}
async function pull() {
  if (S.mode !== 'api' || pulling || !$('#login').hidden) return;
  if (S.busy || S.timers.size) { schedulePull(1500); return; }
  pulling = true;
  const epoch = S.epoch;
  // Hidden tabs stop polling; visibilitychange pulls again when the CRM comes back.
  let again = document.visibilityState === 'visible' ? 20000 : 0;
  try {
    const j = await api('GET', null, '/data' + (S.ver ? '?v=' + encodeURIComponent(S.ver) : ''));
    if (S.busy || S.timers.size || epoch !== S.epoch) { again = 1500; return; } // a write landed meanwhile: this read may be stale
    S.ready = true;
    setSync('api');
    if (j.unchanged) return;
    S.ver = j.version;
    const next = new Map();
    for (const raw of j.leads || []) {
      if (!raw || !raw.id || S.deleted.has(raw.id)) continue;
      next.set(raw.id, { ...raw, ...(S.inflight.get(raw.id) || {}), ...(S.overlay.get(raw.id) || {}), id: raw.id });
    }
    for (const id of S.creating) if (!next.has(id) && S.leads.has(id)) next.set(id, S.leads.get(id));
    S.leads = next;
    if (j.cfg) { S.cfg = fixCfg(j.cfg); UI.filtersKey = ''; }
    scheduleRender();
  } catch (e) {
    if (e && e.code === 'unauthenticated') { again = 0; return; }
    setSync('offline');
    again = 15000;
    if (!S.ready) {
      S.ready = true; scheduleRender();
      toast(e && e.message ? 'Planilha: ' + e.message : 'Não consegui ler a planilha. Tentando de novo…', { tone: 'bad', ms: 9000 });
    }
  } finally {
    pulling = false;
    if (again) schedulePull(again);
  }
}

async function startApi() {
  S.mode = 'api'; setSync('loading');
  const erro = new URLSearchParams(location.search).get('erro');

  let r, j = {};
  try { r = await fetch(API + '/session', { cache: 'no-store', credentials: 'same-origin' }); j = await r.json().catch(() => ({})); }
  catch { showLogin('rede'); return; }
  if (r.status === 404) { startLocal('static'); return; } // static hosting without the CRM server
  if (r.status === 503 && j.code === 'not_configured') { showLogin('config', j.missing); return; }

function cardHTML(l, dup) {
  const open = isOpen(l);
  const due = open ? dueInfo(l.prox) : null;
  const servs = Array.isArray(l.servicos) ? l.servicos : [];
  const sub = [l.empresa ? l.contato : '', l.nicho].filter(Boolean).join(' · ');
  const days = Math.floor((Date.now() - num(l.stageAt || l.createdAt)) / 864e5);
  const flags = [];
  if (l.foneAviso) flags.push(`<span class="flag" title="${esc(l.foneAviso)}">!</span>`);
  if (l.e164 && dup.has(l.e164)) flags.push('<span class="flag" title="Este telefone aparece em outro lead">2×</span>');
  const right = [];
  if (open && days >= 7) right.push(`<span class="c-stale" title="Dias parado nesta etapa">${days}d parado</span>`);
  if (due) right.push(`<span class="due ${due.cls}" title="Próximo retorno: ${fmtDMY(l.prox)}">${due.txt}</span>`);
  else if (open) right.push('<span class="due none" title="Defina o próximo retorno">sem retorno</span>');
  else if (l.stage === 'fechado' && l.wonAt) right.push(`<span class="due" title="Data do fechamento">${fmtDM(ymd(new Date(l.wonAt)))}</span>`);
  if (l.resp) right.push(`<span class="avatar" title="${esc(l.resp)}">${esc(initials(l.resp))}</span>`);
  return `<article class="card${UI.flash === l.id ? ' won-flash' : ''}" data-id="${esc(l.id)}" tabindex="0" aria-label="${esc(nm(l))}, ${esc(STAGE[l.stage]?.n || '')}">
  <div class="card-in">
    <div class="c-top"><h3 class="c-name">${esc(nm(l))}</h3>${flags.join('')}${tempHTML(l.temp)}</div>
    ${sub ? `<p class="c-sub">${esc(sub)}</p>` : ''}
    ${servs.length || l.exemplo ? `<div class="c-tags">${servs.slice(0, 2).map(s => `<span class="tag">${esc(s)}</span>`).join('')}${servs.length > 2 ? `<span class="tag" title="${esc(servs.slice(2).join(', '))}">+${servs.length - 2}</span>` : ''}${l.exemplo ? '<span class="tag ex">exemplo</span>' : ''}</div>` : ''}
    ${l.stage === 'perdido' && l.perda ? `<p class="c-loss">${esc(l.perda)}</p>` : ''}
    <div class="c-foot"><span class="c-fee">${num(l.fee) ? money(l.fee) + '<small>/mês</small>' : ''}</span>${right.join('')}</div>

// Replaces the "Name | ..." line for one name, keeping lines of names no longer in the menus.
function setCfgLine(lines, name, line) {
  const out = (lines || []).slice();
  const i = out.findIndex(x => norm(splitCfg(x)[0]) === norm(name));
  if (i < 0) out.push(line); else out[i] = line;
  return out.filter((x, j) => j === (i < 0 ? out.length - 1 : i) || norm(splitCfg(x)[0]) !== norm(name));
}
function savePrice(el) {
  if (el.dataset.price != null) {
    const n = el.dataset.price, cur = priceOf(n);
    const p = { ...cur, [el.dataset.pk]: parseMoney(el.value) };
    saveCfg({ ...S.cfg, precos: setCfgLine(S.cfg.precos, n, `${n} | ${p.setup} | ${p.fee}`) });
  } else {
    const n = el.dataset.niche;
    let v = parseFloat(String(el.value).replace(',', '.').replace('%', ''));
    v = isFinite(v) ? Math.max(-90, Math.min(500, v)) : 0;
    saveCfg({ ...S.cfg, fatores: setCfgLine(S.cfg.fatores, n, `${n} | ${v}`) });
  }
}

function toast(msg, { action, onAction, tone, ms = 4500 } = {}) {
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (tone ? ' ' + tone : '');
  t.innerHTML = `<span></span>${action ? `<button type="button">${esc(action)}</button>` : ''}`;
  t.firstElementChild.textContent = msg;
  const kill = () => { t.remove(); };
  if (action) t.querySelector('button').addEventListener('click', () => { kill(); onAction && onAction(); });
  box.appendChild(t);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(kill, ms);
}
const tip = $('#tip');
function showTip(el) {
  const txt = el.getAttribute('data-tip'); if (!txt) return hideTip();
  tip.textContent = txt; tip.hidden = false;
  const r = el.getBoundingClientRect(); const tr = tip.getBoundingClientRect();
  let x = r.left + r.width / 2 - tr.width / 2; x = Math.max(8, Math.min(x, innerWidth - tr.width - 8));
  let y = r.top - tr.height - 8; if (y < 8) y = r.bottom + 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.hidden = true; }

  if (S.readOnly) return;
  const stage = preset.stage || 'novo';
  const servs = new Set();
  openModal(`<h3>Novo lead</h3>
    <form id="newForm" class="grid2" autocomplete="off">
      ${fld('Empresa', '<input class="inp" id="n-empresa" placeholder="Nome do negócio">')}
      ${fld('Contato', '<input class="inp" id="n-contato" placeholder="Com quem você fala">')}
      <div class="field"><label class="lbl-s" for="n-whats">WhatsApp</label><input class="inp" id="n-whats" type="tel" inputmode="tel" placeholder="(45) 99999-9999"><p class="hint warn" id="n-warn"></p></div>
      ${fld('Fee mensal', '<span class="affix"><b>R$</b><input class="inp" id="n-fee" inputmode="decimal" placeholder="0"></span>')}
      ${fld('Canal de entrada', `<span class="sel block"><select class="inp" id="n-canal"><option value="">Selecionar</option>${S.cfg.canais.map(o => `<option>${esc(o)}</option>`).join('')}</select></span>`)}
      ${fld('Origem detalhada', `<span class="sel block"><select class="inp" id="n-origem"><option value="">Selecionar</option>${S.cfg.origens.map(o => `<option>${esc(o)}</option>`).join('')}</select></span>`)}
      <div class="field" style="grid-column:1/-1"><span class="lbl-s">Serviços de interesse</span><div class="chips" id="n-servs">${S.cfg.servicos.map(s => `<button type="button" class="chk" data-nserv="${esc(s)}" aria-pressed="false">${esc(s)}</button>`).join('')}</div></div>
      ${fld('Etapa', `<span class="sel block"><select class="inp" id="n-stage">${STAGES.filter(s => s.k !== 'perdido').map(s => `<option value="${s.k}"${s.k === stage ? ' selected' : ''}>${s.n}</option>`).join('')}</select></span>`)}
      ${fld('Próximo retorno', `<input class="inp" id="n-prox" type="date" value="${addDays(today(), 1)}">`)}
      ${fld('Responsável', `<span class="sel block"><select class="inp" id="n-resp"><option value="">Ninguém</option>${S.cfg.resps.map((o, i) => `<option${i === 0 ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></span>`)}
      ${fld('Nicho', `<span class="sel block"><select class="inp" id="n-nicho"><option value="">Selecionar</option>${S.cfg.nichos.map(o => `<option>${esc(o)}</option>`).join('')}</select></span>`)}
      <p class="hint warn" id="n-err" style="grid-column:1/-1" hidden>Preencha pelo menos a empresa ou o contato.</p>
      <div class="m-actions" style="grid-column:1/-1"><button class="btn" type="button" data-mclose>Cancelar</button><button class="btn btn-gold" type="submit">${I.plus}Criar lead</button></div>
    </form>`);
  $('#n-servs').addEventListener('click', e => { const b = e.target.closest('[data-nserv]'); if (!b) return; const s = b.dataset.nserv; servs.has(s) ? servs.delete(s) : servs.add(s); b.setAttribute('aria-pressed', String(servs.has(s))); });
  $('#n-whats').addEventListener('input', e => { const v = e.target.value; $('#n-warn').textContent = v.replace(/\D/g, '').length >= 10 ? phoneInfo(v).warn : ''; });
  $('#newForm').addEventListener('submit', e => {
    e.preventDefault();
    const empresa = $('#n-empresa').value.trim(), contato = $('#n-contato').value.trim();
    if (!empresa && !contato) { $('#n-err').hidden = false; $('#n-empresa').focus(); return; }
    const ph = phoneInfo($('#n-whats').value);
    const st = $('#n-stage').value;
    const l = blankLead({
      empresa, contato, whats: $('#n-whats').value.trim(), e164: ph.e164, foneAviso: ph.warn,
      fee: parseMoney($('#n-fee').value), canal: $('#n-canal').value, origem: $('#n-origem').value, servicos: [...servs],
      stage: st, prox: $('#n-prox').value, resp: $('#n-resp').value, nicho: $('#n-nicho').value, wonAt: st === 'fechado' ? Date.now() : 0
    });
    const id = createLead(l);
    closeModal(true);
    if (UI.view !== 'funil' && UI.view !== 'lista') setView('funil');
    toast(`${nm(l)} entrou em ${STAGE[st].n}`, { action: 'Abrir', onAction: () => openDrawer(id) });
  });
}

/* ================= follow-up pelo WhatsApp ================= */
const FOLLOWUPS = [
  { k: 'contato', n: 'Primeiro contato', t: '{saud}, {nome}! Aqui é {eu} da Shark Digital. Vi que você falou com a gente sobre {servicos}. Me conta um pouco do momento de vocês hoje? Assim já te indico o melhor caminho.' },
  { k: 'semresposta', n: 'Sem resposta', t: '{saud}, {nome}! Tudo bem? Passando para retomar nossa conversa sobre {servicos}. Faz sentido marcarmos uma conversa rápida de 15 minutos esta semana?' },
  { k: 'reuniao', n: 'Confirmar reunião', t: '{saud}, {nome}! Passando para confirmar nossa reunião. Segue de pé? Qualquer imprevisto é só me avisar por aqui.' },
  { k: 'posreuniao', n: 'Pós-reunião', t: '{saud}, {nome}! Obrigado pela conversa. Estou fechando a proposta com base no que falamos e te envio em breve. Ficou alguma dúvida até aqui?' },
  { k: 'proposta', n: 'Proposta enviada', t: '{saud}, {nome}! Conseguiu dar uma olhada na proposta que te enviei{valor}? Fico à disposição para tirar dúvidas ou ajustar o que for preciso.' },
  { k: 'negociacao', n: 'Negociação', t: '{saud}, {nome}! Como ficou a análise da proposta? Se ajudar, consigo ver uma condição para começarmos ainda este mês.' },
  { k: 'reativar', n: 'Retomar contato', t: '{saud}, {nome}! Faz um tempo que não nos falamos. Como estão as coisas por aí? Se ainda fizer sentido melhorar {servicos}, tenho algumas ideias para te mostrar.' }
];
const FOLLOWUP_BY_STAGE = { novo: 'contato', contato: 'contato', aguardando: 'semresposta', reuniao: 'reuniao', diagnostico: 'posreuniao', proposta: 'proposta', negociacao: 'negociacao', fechado: 'reativar', perdido: 'reativar' };
function followupText(l, k) {
  const tpl = (FOLLOWUPS.find(f => f.k === k) || FOLLOWUPS[0]).t;
  const h = new Date().getHours();
  const servs = l.servicos || [];
  const vars = {
    saud: h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite',
    nome: String(l.contato || '').trim().split(/\s+/)[0] || '',
    eu: (S.me && S.me.name ? S.me.name.split(' ')[0] : l.resp) || 'a equipe',
    servicos: servs.length ? (servs.length > 1 ? servs.slice(0, -1).join(', ') + ' e ' + servs[servs.length - 1] : servs[0]) : 'o marketing de vocês',
    valor: num(l.fee) ? ` (${money(l.fee)}/mês)` : ''
  };
  return tpl.replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '').replace(/, !/g, '!').replace(/\s+([!?.,])/g, '$1');
}
function openFollowup(id) {
  const l = S.leads.get(id); if (!l) return;
  let k = FOLLOWUP_BY_STAGE[l.stage] || 'contato';
  const canWrite = !S.readOnly;
  openModal(`<h3>Follow-up · ${esc(nm(l))}</h3>
    <div class="qt" id="fu">
      <div class="field"><span class="lbl-s">Situação</span><div class="chips" id="fu-kind">${FOLLOWUPS.map(f => `<button type="button" class="chk" data-fu="${f.k}" aria-pressed="${f.k === k}">${f.n}</button>`).join('')}</div></div>
      ${fld('Mensagem', `<textarea class="inp" id="fu-msg" rows="6" style="height:auto;padding:10px 11px;line-height:1.45;resize:vertical">${esc(followupText(l, k))}</textarea>`)}
      <p class="hint">Pode editar à vontade antes de enviar. ${l.e164 ? `Vai para ${esc(fmtPhone(l.e164))}.` : '<span style="color:var(--warn)">Este lead não tem WhatsApp válido. Copie a mensagem ou corrija o número no lead.</span>'}</p>
      ${canWrite ? `<div class="field"><span class="lbl-s">Próximo retorno em</span><div class="seg" id="fu-next">${[[1, '1 dia'], [3, '3 dias'], [7, '7 dias'], [0, 'Não agendar']].map(([n, t]) => `<button type="button" data-fn="${n}" aria-pressed="${n === 3}">${t}</button>`).join('')}</div><p class="hint">Registra o follow-up no histórico do lead e agenda o próximo retorno.</p></div>` : ''}
      <div class="m-actions">
        <button class="btn" type="button" data-fucopy>${I.copy}Copiar</button>
        <button class="btn btn-gold" type="button" data-fusend${l.e164 ? '' : ' disabled'}>${I.wa}Enviar no WhatsApp</button>
      </div>
    </div>`);
  const box = $('#fu');
  let next = 3, edited = false;
  box.addEventListener('input', e => { if (e.target.id === 'fu-msg') edited = true; });
  box.addEventListener('click', e => {
    const t = e.target; let el;
    if ((el = t.closest('[data-fu]'))) {
      if (edited && !confirm('Trocar a mensagem? O texto que você editou será substituído.')) return;
      k = el.dataset.fu; edited = false;
      $$('[data-fu]', box).forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      $('#fu-msg').value = followupText(S.leads.get(id) || l, k);
      return;
    }
    if ((el = t.closest('[data-fn]'))) { next = +el.dataset.fn; $$('[data-fn]', box).forEach(b => b.setAttribute('aria-pressed', String(b === el))); return; }
    if (t.closest('[data-fucopy]')) { const v = $('#fu-msg').value.trim(); navigator.clipboard.writeText(v).then(() => toast('Mensagem copiada.'), () => toast('Não deu para copiar automaticamente.', { tone: 'bad' })); return; }
    if (t.closest('[data-fusend]')) {
      const cur = S.leads.get(id) || l;
      const msg = $('#fu-msg').value.trim();
      if (!cur.e164 || !msg) return;
      window.open(waUrl(cur) + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
      if (canWrite && S.leads.has(id)) {
        const p = { hist: pushHist(cur, { t: Date.now(), k: 'note', txt: `Follow-up enviado no WhatsApp (${FOLLOWUPS.find(f => f.k === k).n}):\n${msg}` }) };
        if (next) p.prox = addDays(today(), next);
        patchLead(id, p);
        toast(next ? `${nm(cur)}: follow-up registrado, próximo retorno em ${fmtDM(p.prox)}` : `${nm(cur)}: follow-up registrado`);
      }
      closeModal(true);
    }
  });
}

/* ================= orçamento ================= */
function quoteCalc(q) {
  const factor = (1 + nichePct(q.nicho) / 100) * (1 + (SCOPES.find(s => s.k === q.scope)?.pct || 0) / 100);
  const items = [...q.servs].map(n => {
    const base = priceOf(n), ov = q.over.get(n) || {};
    return {
      n,
      setup: ov.setup != null ? ov.setup : roundPrice(base.setup * factor),
      fee: ov.fee != null ? ov.fee : roundPrice(base.fee * factor),
      edited: ov.setup != null || ov.fee != null
    };
  });
  const subSetup = items.reduce((a, i) => a + i.setup, 0), subFee = items.reduce((a, i) => a + i.fee, 0);
  const k = 1 - Math.min(100, Math.max(0, q.desc)) / 100;
  const setup = Math.round(subSetup * k), fee = Math.round(subFee * k);
  return { items, subSetup, subFee, setup, fee, total: setup + fee * q.meses, factor };
}
function quoteText(q, c) {
  const scope = SCOPES.find(s => s.k === q.scope);
  const L = ['*Orçamento Shark Digital*'];
  if (q.cliente) L.push('Cliente: ' + q.cliente);
  L.push([q.nicho && 'Nicho: ' + q.nicho, 'Escopo: ' + scope.n].filter(Boolean).join(' · '), '');
  for (const i of c.items) {
    const parts = [];
    if (i.setup) parts.push(`${money(i.setup)} de implantação`);
    if (i.fee) parts.push(`${money(i.fee)}/mês`);
    L.push(`• ${i.n}: ${parts.join(' + ') || 'a combinar'}`);
  }
  L.push('');
  if (q.desc) L.push(`Desconto aplicado: ${NUMF.format(q.desc)}%`);
  if (c.setup) L.push(`*Implantação (pagamento único): ${money(c.setup)}*`);
  if (c.fee) L.push(`*Mensalidade: ${money(c.fee)}/mês*`);
  if (c.fee && q.meses > 1) L.push(`Contrato de ${q.meses} meses: ${money(c.total)} no total`);
  if (q.verba) L.push(`Verba de mídia sugerida: ${money(q.verba)}/mês (paga direto às plataformas de anúncio)`);
  L.push('', 'Proposta válida por 15 dias.');
  return L.join('\n');
}

    .tot span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#6F7988}.tot b{font-size:20px}

  </style></head><body>
    <header><h1><small>Shark Digital</small>Proposta comercial</h1><div class="meta">Emitida em ${dmy(d)}<br>Válida até ${dmy(val)}</div></header>
    ${q.cliente ? `<p><b>Cliente:</b> ${esc(q.cliente)}</p>` : ''}
    <p>${[q.nicho && '<b>Nicho:</b> ' + esc(q.nicho), '<b>Escopo:</b> ' + scope.n].filter(Boolean).join(' &nbsp;·&nbsp; ')}</p>
    <table><thead><tr><th>Serviço</th><th>Implantação</th><th>Mensal</th></tr></thead><tbody>${rows}</tbody></table>
    ${q.desc ? `<p class="note">Desconto de ${NUMF.format(q.desc)}% já aplicado nos totais.</p>` : ''}
    <div class="tot">
      <div><span>Implantação</span><b>${money(c.setup)}</b></div>
      <div><span>Mensalidade</span><b>${money(c.fee)}</b></div>
      ${c.fee && q.meses > 1 ? `<div><span>Total em ${q.meses} meses</span><b>${money(c.total)}</b></div>` : ''}
    </div>
    ${q.verba ? `<p class="note">Verba de mídia sugerida: ${money(q.verba)}/mês, paga direto às plataformas de anúncio (não inclusa nos valores acima).</p>` : ''}
  </body></html>`;
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(fr);
  const w = fr.contentWindow;
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(() => { try { w.focus(); w.print(); } catch { toast('Não deu para abrir a impressão neste navegador.', { tone: 'bad' }); } setTimeout(() => fr.remove(), 1000); }, 250);
}

    const fix = parseMoney($('#adsFix').value);
